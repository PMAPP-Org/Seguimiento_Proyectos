name: Backend CI

# Gate de CI de server/ (Paso 3 del plan; endurecido en la línea base de
# seguridad ISO 27001 — A.8.8, A.8.9, A.8.25, A.8.29, A.8.31).
#
# Reglas de este archivo:
# - Sin filtro de `paths`: un check marcado como requerido en la protección
#   de rama tiene que reportar en todos los PRs, y con filtro el primer push
#   de una rama podía no disparar el workflow nunca (le pasó a este repo:
#   Backend CI no llegó a ejecutarse en GitHub hasta esta corrección).
# - Sin pasos "si no existe, omitir": el código ya existe, así que un archivo
#   que falta es un fallo real, no un PASS silencioso.
# - Actions fijadas por SHA de commit (el comentario dice qué versión es) y
#   dependencias instaladas desde `requirements-dev.lock` con hashes.
# - `permissions` mínimos: este workflow solo lee el repositorio.

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    name: ruff + mypy + pytest + manage.py checks
    runs-on: ubuntu-latest
    # PostgreSQL real (hallazgo "Important" de la revisión del Paso 5): sin
    # este servicio la mitad de integración de la suite se salta en silencio.
    # `VISITACAMPO_REQUIRE_DB=1` convierte ese salto en fallo
    # (`visitacampo/core/tests/dbsupport.py`).
    services:
      postgres:
        image: postgres:16@sha256:ca0bd484cb98bf4b24eb1010e73fb3fcbd6714d240fbc1a10eea5b7dbecb641d
        env:
          POSTGRES_DB: visitacampo
          POSTGRES_USER: visitacampo
          POSTGRES_PASSWORD: ci_postgres_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      POSTGRES_DB: visitacampo
      POSTGRES_USER: visitacampo
      POSTGRES_PASSWORD: ci_postgres_password
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Instalar dependencias (requirements-dev.lock, con hashes)
        run: python -m pip install --require-hashes -r server/requirements-dev.lock

      - name: ruff check
        run: ruff check server/

      - name: mypy
        run: mypy --config-file server/pyproject.toml server/

      # Cobertura de ramas del código de producción con suelo `fail_under`
      # (server/pyproject.toml, [tool.coverage.report]): bajar de ahí falla.
      - name: pytest + cobertura (contra PostgreSQL real)
        env:
          VISITACAMPO_REQUIRE_DB: "1"
        run: |
          pytest server/ --cov --cov-config=server/pyproject.toml \
            --cov-report=term --cov-report=xml:coverage-server.xml

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: coverage-server
          path: coverage-server.xml
          retention-days: 30

      - name: makemigrations --check
        run: python server/manage.py makemigrations --check --dry-run

      # `check --deploy` contra los settings que se despliegan (prod.py), no
      # contra dev.py: con dev.py el comando solo puede advertir de lo que
      # dev.py hace a propósito, y no protege nada. Los valores de entorno
      # son de usar y tirar, solo para que prod.py cargue.
      - name: manage.py check --deploy (settings de producción)
        env:
          DJANGO_SETTINGS_MODULE: config.settings.prod
          DJANGO_ALLOWED_HOSTS: ci.invalid
        run: |
          DJANGO_SECRET_KEY="$(python -c 'import secrets; print(secrets.token_urlsafe(64))')" \
            python server/manage.py check --deploy --fail-level WARNING

  security:
    name: SAST + auditoría de dependencias + SBOM
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Instalar herramientas (requirements-dev.lock, con hashes)
        run: python -m pip install --require-hashes -r server/requirements-dev.lock

      # Dependabot actualiza los .txt pero no regenera los .lock de uv: sin
      # este check su PR quedaría en verde sin cambiar lo que se instala.
      - name: Lockfiles coherentes con sus fuentes
        run: python infra/scripts/check_lockfiles.py

      # Los falsos positivos revisados se suprimen en el código por id exacto
      # (`# nosec B608`…), nunca desactivando reglas aquí.
      - name: bandit (SAST)
        run: bandit -q -r server/visitacampo server/config -x '*/tests/*,*/migrations/*'

      - name: pip-audit (advisories PyPA/OSV)
        run: |
          pip-audit --require-hashes --disable-pip --progress-spinner off \
            -r server/requirements.lock -r server/requirements-dev.lock \
            -r server/requirements-dast.lock

      # Aparte, para que la excepción EXC-001 (docs/seguridad/excepciones.md)
      # solo cubra el lock de Semgrep, y caduque: desde 2027-01-01 deja de
      # ignorarse y el paso vuelve a fallar si sigue sin corregir.
      - name: pip-audit (herramientas SAST)
        run: |
          ignore=""
          if [ "$(date -u +%Y%m%d)" -le 20261231 ]; then
            ignore="--ignore-vuln GHSA-84m7-p3x7-pcfv"
          fi
          # shellcheck disable=SC2086
          pip-audit --require-hashes --disable-pip --progress-spinner off \
            $ignore -r server/requirements-sast.lock

      # Workflows de GitHub Actions como código (OWASP A03/A08): inyección en
      # expresiones `${{ }}`, permisos excesivos, actions sin fijar o con
      # vulnerabilidades conocidas. Con token, zizmor hace también las
      # auditorías que consultan la API de GitHub.
      - name: zizmor (seguridad de .github/workflows)
        env:
          GH_TOKEN: ${{ github.token }}
        run: zizmor --no-progress --format plain .github/workflows

      - name: SBOM CycloneDX de la imagen (requirements.lock)
        run: |
          cyclonedx-py requirements server/requirements.lock \
            --output-format JSON --output-file sbom-server.cdx.json

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom-server
          path: sbom-server.cdx.json
          retention-days: 90

  docker-build:
    name: docker build + hadolint + grype (server/Dockerfile)
    runs-on: ubuntu-latest
    # Verifica que la imagen se construye desde el lockfile con
    # `--require-hashes`, que el Dockerfile pasa el lint y que la imagen
    # resultante no tiene vulnerabilidades altas con parche disponible. No
    # publica nada: eso lo hace release.yml.
    env:
      HADOLINT_VERSION: 2.15.1
      HADOLINT_SHA256: c7187db94eeeeca956519a6af171adc31453941a1e777961f6e680f697c8c507
      GRYPE_VERSION: 0.120.1
      GRYPE_SHA256: 0a9ee97ef5ae2ee953b0a80098105052e846cdbe319a57d808b519c33cd1343d
      SYFT_VERSION: 1.54.1
      SYFT_SHA256: c069905b391cc4c20a5ba65ad5c10be2a7ba074f8ea6ad203e24d14e303dad47
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Instalar hadolint y grype (versión fija + checksum)
        run: |
          curl -sSfL -o hadolint \
            "https://github.com/hadolint/hadolint/releases/download/v${HADOLINT_VERSION}/hadolint-linux-x86_64"
          echo "${HADOLINT_SHA256}  hadolint" | sha256sum -c -
          curl -sSfL -o grype.tar.gz \
            "https://github.com/anchore/grype/releases/download/v${GRYPE_VERSION}/grype_${GRYPE_VERSION}_linux_amd64.tar.gz"
          echo "${GRYPE_SHA256}  grype.tar.gz" | sha256sum -c -
          tar -xzf grype.tar.gz grype
          curl -sSfL -o syft.tar.gz \
            "https://github.com/anchore/syft/releases/download/v${SYFT_VERSION}/syft_${SYFT_VERSION}_linux_amd64.tar.gz"
          echo "${SYFT_SHA256}  syft.tar.gz" | sha256sum -c -
          tar -xzf syft.tar.gz syft
          chmod +x hadolint grype syft
          rm grype.tar.gz syft.tar.gz

      # Excepciones revisadas en .hadolint.yaml.
      - name: hadolint
        run: ./hadolint --config .hadolint.yaml server/Dockerfile

      - name: docker build
        run: docker build --pull -t visitacampo-api:ci server/

      # SBOM de la imagen completa (paquetes Debian + Python instalados), no
      # solo de requirements: es lo que realmente se despliega. CycloneDX y
      # SPDX, los dos formatos que piden clientes y auditores (ISO 27001
      # A.8.8, OWASP A03:2025).
      - name: SBOM de la imagen (syft)
        run: |
          ./syft visitacampo-api:ci -q \
            -o cyclonedx-json=sbom-api-image.cdx.json \
            -o spdx-json=sbom-api-image.spdx.json

      # Se escanea el SBOM recién generado: lo que se reporta como vulnerable
      # es exactamente lo inventariado. `--only-fixed`: falla por lo que se
      # puede arreglar hoy (subir el digest de la base o una dependencia);
      # las CVE de Debian sin parche publicado quedan en el informe.
      - name: grype (vulnerabilidades de la imagen)
        run: |
          ./grype sbom:sbom-api-image.cdx.json --only-fixed --fail-on high \
            -o table -o sarif=grype-api.sarif

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: sbom-and-scan-api-image
          path: |
            sbom-api-image.cdx.json
            sbom-api-image.spdx.json
            grype-api.sarif
          retention-days: 90

  check-envvars:
    name: check_envvars.sh (infra/.env.example)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: bash infra/scripts/check_envvars.sh
        run: bash infra/scripts/check_envvars.sh infra/.env.example infra/.env.example
