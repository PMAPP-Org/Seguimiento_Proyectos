name: Backend CI

# Paso 3 del plan (plans/visitacampo-construccion.md): gate de CI para
# server/ (Django + Ninja, se inicializa en el Paso 4). Este workflow se
# activa desde ya, aunque server/ hoy solo tiene un .gitkeep — doc 08 §8
# Fase 0 exige el gate desde el principio para que ningún paso posterior
# pueda saltárselo.
#
# Sin remoto de GitHub configurado en el entorno de desarrollo actual, este
# workflow no se ha ejecutado nunca en Actions real. El equivalente
# ejecutable localmente es `infra/scripts/ci_local.sh` (ver también
# CONTRIBUTING.md). Cuando el repo tenga remoto en GitHub, este workflow se
# activa automáticamente sin cambios adicionales.
#
# Cada paso `run:` es defensivo: si server/ todavía no tiene el archivo que
# necesita (manage.py, algún *.py) o la herramienta aplicable, se informa y
# se omite en vez de fallar — "0 archivos que lintar no es un fallo" (brief
# del Paso 3). Esto es intencional y temporal: a partir del Paso 4, cuando
# exista código real, estos mismos comandos pasan a evaluar contenido real.

on:
  push:
    branches: ["**"]
    paths:
      - "server/**"
      - "infra/.env.example"
      - "infra/scripts/check_envvars.sh"
      - ".github/workflows/backend.yml"
  pull_request:
    paths:
      - "server/**"
      - "infra/.env.example"
      - "infra/scripts/check_envvars.sh"
      - ".github/workflows/backend.yml"
  workflow_dispatch: {}

jobs:
  lint-and-test:
    name: ruff + mypy + pytest + manage.py checks
    runs-on: ubuntu-latest
    # Añadido tras el hallazgo "Important" de la revisión del Paso 5: sin
    # esto, `_probe_database()` de `test_models.py` nunca encontraba una
    # PostgreSQL real y la mitad 2 de la suite (el CHECK de ADR-005, la FK
    # compuesta anti-cruce de organizaciones de ADR-011, y de paso
    # `manage.py migrate` mismo) se saltaba en silencio en todo entorno,
    # incluido CI — cero exigencia real detrás de un run en verde. Nombres
    # de servicio/variables y valores por defecto calcados de
    # `infra/.env.example` (Paso 2) y de `POSTGRES_*` en
    # `server/config/settings/base.py` (Paso 4), no inventados aquí.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: visitacampo
          POSTGRES_USER: visitacampo
          # Valor ephemeral solo para este contenedor de CI — no es el
          # placeholder real de infra/.env.example (ese nunca debe usarse
          # fuera de una máquina de desarrollo) y no protege nada que
          # sobreviva al job.
          POSTGRES_PASSWORD: ci_postgres_password
        ports:
          - 5432:5432
        # Sin esto, los pasos siguientes podrían arrancar antes de que
        # Postgres acepte conexiones y `_probe_database()` fallaría por una
        # razón de arranque, no por falta de servicio — un falso negativo
        # distinto del que este fix busca eliminar.
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Mismos nombres que infra/.env.example y que lee
      # server/config/settings/base.py (Paso 4) — no se inventan variables
      # nuevas. HOST es "localhost" (no "db"): el runner de Actions habla con
      # el contenedor de servicio por el puerto mapeado de arriba, no por la
      # red interna de docker-compose que usa el hostname "db" en dev.
      POSTGRES_DB: visitacampo
      POSTGRES_USER: visitacampo
      POSTGRES_PASSWORD: ci_postgres_password
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar ruff, mypy, pytest
        run: python -m pip install --upgrade pip ruff mypy pytest

      - name: Instalar dependencias del proyecto (server/requirements.txt)
        # Añadido en el Paso 4: sin esto, Django/Ninja/Argon2/psycopg no
        # están disponibles y mypy/pytest/manage.py fallarían con
        # ModuleNotFoundError en vez de evaluar el código real.
        run: |
          if [ -f server/requirements.txt ]; then
            python -m pip install -r server/requirements.txt
          else
            echo "server/requirements.txt todavía no existe (se crea en el Paso 4) — instalación omitida."
          fi

      - name: ruff check server/
        run: ruff check server/

      - name: mypy server/
        run: |
          if find server -name '*.py' -not -path '*/.venv/*' | grep -q .; then
            # mypy busca su configuración en el directorio desde el que se
            # invoca (la raíz del repo aquí), no en el argumento de ruta, así
            # que server/pyproject.toml (Paso 4) se referencia explícitamente.
            mypy --config-file server/pyproject.toml server/
          else
            echo "server/ todavía no tiene archivos .py (se crea en el Paso 4) — mypy pasa vacío."
          fi

      - name: pytest server/
        # VISITACAMPO_REQUIRE_DB=1 (test_models.py, hallazgo de la revisión
        # del Paso 5): con el servicio postgres:16 de arriba ya no hay
        # excusa para que la mitad 2 de la suite se salte. Si algún día deja
        # de haber PostgreSQL alcanzable aquí (servicio caído, credenciales
        # mal, lo que sea), este paso debe fallar fuerte, no reportar verde.
        env:
          VISITACAMPO_REQUIRE_DB: "1"
        run: |
          if find server -name 'test_*.py' -o -name '*_test.py' | grep -q .; then
            pytest server/
          else
            echo "server/ todavía no tiene tests (se crean a partir del Paso 4) — pytest pasa vacío."
          fi

      - name: python manage.py check --deploy
        run: |
          if [ -f server/manage.py ]; then
            python server/manage.py check --deploy
          else
            echo "server/manage.py todavía no existe (se crea en el Paso 4) — check omitido."
          fi

      - name: python manage.py makemigrations --check --dry-run
        run: |
          if [ -f server/manage.py ]; then
            python server/manage.py makemigrations --check --dry-run
          else
            echo "server/manage.py todavía no existe (se crea en el Paso 4) — check omitido."
          fi

  check-envvars:
    name: check_envvars.sh (infra/.env.example, Paso 2)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: bash infra/scripts/check_envvars.sh
        # En CI no existe infra/.env real (nunca se versiona, ver .gitignore,
        # y no hay secretos reales disponibles para un runner público). El
        # auto-chequeo contra sí mismo verifica que infra/.env.example esté
        # bien formado y sea la referencia válida — el script ya soporta
        # rutas explícitas exactamente para este uso (ver su comentario de
        # cabecera: "rutas explícitas (tests, CI)"). La comparación contra un
        # `.env` real con valores reales sigue haciéndose en local/despliegue.
        run: bash infra/scripts/check_envvars.sh infra/.env.example infra/.env.example
