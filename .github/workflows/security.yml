name: Security

# Gates de seguridad transversales al monorepo (línea base ISO 27001):
# - gitleaks: secretos en todo el historial de git (A.8.4, A.8.12).
# - osv-scanner: vulnerabilidades conocidas en los lockfiles de app/ y
#   server/ (A.8.8). Corre también cada semana: una dependencia que no
#   cambia puede volverse vulnerable porque se publica un advisory nuevo.
# - semgrep: SAST multi-lenguaje con las reglas OWASP Top 10 y las de
#   Python/Django, auditoría de seguridad, secretos, Dockerfile y GitHub
#   Actions (OWASP A01–A10:2025; ISO 27001 A.8.28). Complementa a Bandit
#   (patrones Python) y CodeQL (flujo de datos): cubre también YAML de
#   workflows, Dockerfiles y configuración.
# - actionlint: sintaxis y semántica de los workflows, y shellcheck sobre cada
#   `run:` (un `)` sobrante en un paso solo se veía al ejecutarse en CI).
#
# Las herramientas se descargan como binario oficial con versión fija y se
# verifica su SHA-256 antes de ejecutarlas, en vez de usar una action de
# terceros (gitleaks-action tiene licencia comercial; osv-scanner-action
# referencia su imagen por tag mutable). Para actualizar una herramienta:
# cambiar versión + hash, ambos tomados del archivo de checksums de su
# release en GitHub.

on:
  push:
    branches: [master]
  pull_request:
  schedule:
    - cron: "17 6 * * 1" # lunes 06:17 UTC
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    name: gitleaks (historial completo)
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Instalar gitleaks (versión fija + checksum)
        run: |
          curl -sSfL -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          rm gitleaks.tar.gz

      # Falsos positivos revisados: .gitleaksignore (por huella exacta).
      - name: gitleaks git
        run: ./gitleaks git . --redact --no-banner --exit-code 1

  osv-scanner:
    name: osv-scanner (lockfiles)
    runs-on: ubuntu-latest
    env:
      OSV_SCANNER_VERSION: 2.7.0
      OSV_SCANNER_SHA256: 160c6253e2922e9e0a6a9771c5c4c40a4b3c6090b34a3cdd5e80c96cc2e4218b
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Instalar osv-scanner (versión fija + checksum)
        run: |
          curl -sSfL -o osv-scanner \
            "https://github.com/google/osv-scanner/releases/download/v${OSV_SCANNER_VERSION}/osv-scanner_linux_amd64"
          echo "${OSV_SCANNER_SHA256}  osv-scanner" | sha256sum -c -
          chmod +x osv-scanner

      # Los .lock de server/ se declaran como formato requirements.txt: la
      # extensión no le basta a osv-scanner para reconocerlos.
      - name: osv-scanner scan
        run: |
          # Excepciones con caducidad: osv-scanner.toml (docs/seguridad/excepciones.md).
          ./osv-scanner scan source --config=osv-scanner.toml \
            -L app/pubspec.lock \
            -L requirements.txt:server/requirements.lock \
            -L requirements.txt:server/requirements-dev.lock \
            -L requirements.txt:server/requirements-dast.lock \
            -L requirements.txt:server/requirements-sast.lock

  semgrep:
    name: semgrep (OWASP Top 10 + secretos + Docker + Actions)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write # subir el SARIF a Code scanning
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Instalar Semgrep (requirements-sast.lock, con hashes)
        run: python -m pip install --require-hashes -r server/requirements-sast.lock

      # Las reglas de los packs p/… se descargan del registro de Semgrep en
      # cada ejecución: así entran reglas nuevas sin tocar este archivo. La
      # app Flutter queda fuera: Semgrep no tiene reglas de seguridad para
      # Dart; la cubren `dart analyze`, el lint RD-01 y los tests.
      # Falsos positivos revisados: `# nosemgrep: <regla>` junto al código,
      # con su justificación. Nunca se desactiva un pack entero.
      - name: semgrep scan
        run: |
          semgrep scan --metrics=off --error \
            --config=p/owasp-top-ten --config=p/python --config=p/django \
            --config=p/security-audit --config=p/secrets \
            --config=p/dockerfile --config=p/github-actions \
            --exclude='*/tests/*' --exclude='*/migrations/*' --exclude=app/ \
            --sarif --output=semgrep.sarif \
            .

      - uses: github/codeql-action/upload-sarif@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        if: always() && hashFiles('semgrep.sarif') != ''
        with:
          sarif_file: semgrep.sarif
          category: semgrep

  actionlint:
    name: actionlint (workflows + shellcheck de cada run)
    runs-on: ubuntu-latest
    env:
      ACTIONLINT_VERSION: 1.7.12
      ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
      # Bloquea desde `warning`: los `info` de estilo (p. ej. `$COMPOSE` sin
      # comillas, que se separa en palabras a propósito) no son defectos.
      SHELLCHECK_OPTS: --severity=warning
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Instalar actionlint (versión fija + checksum)
        run: |
          curl -sSfL -o actionlint.tar.gz \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          echo "${ACTIONLINT_SHA256}  actionlint.tar.gz" | sha256sum -c -
          tar -xzf actionlint.tar.gz actionlint && rm actionlint.tar.gz

      # shellcheck viene preinstalado en ubuntu-latest; actionlint lo usa solo.
      - name: actionlint
        run: ./actionlint -color
