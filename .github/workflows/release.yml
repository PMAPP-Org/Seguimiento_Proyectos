name: Release

# Versionado, tags y releases automáticos a partir de Conventional Commits
# (ISO 27001 A.8.32 gestión de cambios; OWASP A08:2025 integridad).
#
# 1. release-please mantiene abierto un PR "chore: release X.Y.Z" con el
#    CHANGELOG y la versión calculada desde los commits (feat → minor,
#    fix → patch; antes de 1.0, un breaking change sube minor). La versión se
#    escribe en version.txt, app/pubspec.yaml, app/lib/core/constants.dart y
#    server/pyproject.toml (anotaciones `x-release-please-version`).
# 2. Al mergear ese PR: tag `vX.Y.Z` + GitHub Release con las notas.
# 3. Con la release creada se publican los artefactos, cada uno con
#    atestación de procedencia SLSA firmada (Sigstore) verificable con
#    `gh attestation verify`:
#    - imagen de la API en GHCR, con SBOM SPDX atestado;
#    - APK firmado, solo si existen los secretos de la llave de subida (ver
#      CONTRIBUTING.md, "Releases"); si no, el job lo indica y no publica APK.
# 4. La imagen se despliega en producción con deploy.yml (si está configurado).
#
# Requisitos del repositorio (los configura un admin): Settings → Actions →
# "Allow GitHub Actions to create and approve pull requests", y el
# environment `release` (Settings → Environments; restringido a `master`)
# con los secretos. Opcional: RELEASE_PLEASE_TOKEN (fine-grained, contents +
# pull-requests) para que el PR de release dispare el CI; con GITHUB_TOKEN se
# crea igual, pero GitHub no lanza workflows sobre PRs creados por ese token.

on:
  push:
    branches: [master]
  workflow_dispatch: {}

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release-please:
    name: release-please (PR de release / tag)
    runs-on: ubuntu-latest
    # Los secretos de release viven en el environment `release`, no a nivel
    # de repositorio: un admin puede restringirlo a `master` y exigir
    # aprobación (ISO 27001 A.5.15, A.8.32).
    environment: release
    permissions:
      contents: write
      pull-requests: write
      issues: write # etiquetas autorelease: pending / tagged
    outputs:
      release_created: ${{ steps.rp.outputs.release_created }}
      tag_name: ${{ steps.rp.outputs.tag_name }}
      version: ${{ steps.rp.outputs.version }}
    steps:
      - id: rp
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  image:
    name: Imagen de la API → GHCR (+ SBOM y procedencia)
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    outputs:
      ref: ${{ steps.push.outputs.image }}@${{ steps.push.outputs.digest }}
    permissions:
      contents: write # subir el SBOM a la release
      packages: write # publicar en GHCR
      id-token: write # firmar las atestaciones (Sigstore)
      attestations: write
    env:
      TAG: ${{ needs.release-please.outputs.tag_name }}
      VERSION: ${{ needs.release-please.outputs.version }}
      SYFT_VERSION: 1.54.1
      SYFT_SHA256: c069905b391cc4c20a5ba65ad5c10be2a7ba074f8ea6ad203e24d14e303dad47
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
          persist-credentials: false

      - name: Instalar syft (versión fija + checksum)
        run: |
          curl -sSfL -o syft.tar.gz \
            "https://github.com/anchore/syft/releases/download/v${SYFT_VERSION}/syft_${SYFT_VERSION}_linux_amd64.tar.gz"
          echo "${SYFT_SHA256}  syft.tar.gz" | sha256sum -c -
          tar -xzf syft.tar.gz syft && rm syft.tar.gz

      - name: Build y push a GHCR
        id: push
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/visitacampo-api"
          echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker build --pull \
            --label "org.opencontainers.image.source=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
            --label "org.opencontainers.image.version=${VERSION}" \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            -t "${IMAGE}:${VERSION}" server/
          docker push "${IMAGE}:${VERSION}"
          DIGEST="$(docker inspect --format '{{index .RepoDigests 0}}' "${IMAGE}:${VERSION}" | cut -d@ -f2)"
          echo "image=${IMAGE}" >> "$GITHUB_OUTPUT"
          echo "digest=${DIGEST}" >> "$GITHUB_OUTPUT"
          echo "Publicada ${IMAGE}:${VERSION}@${DIGEST}" >> "$GITHUB_STEP_SUMMARY"

      - name: SBOM SPDX de la imagen publicada
        env:
          IMAGE: ${{ steps.push.outputs.image }}
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          ./syft "${IMAGE}@${DIGEST}" -q \
            -o spdx-json=sbom-api.spdx.json \
            -o cyclonedx-json=sbom-api.cdx.json

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ steps.push.outputs.image }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

      - uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-name: ${{ steps.push.outputs.image }}
          subject-digest: ${{ steps.push.outputs.digest }}
          sbom-path: sbom-api.spdx.json
          push-to-registry: true

      - name: Adjuntar los SBOM a la release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "$TAG" sbom-api.spdx.json sbom-api.cdx.json \
            --repo "$GITHUB_REPOSITORY" --clobber

  # Despliegue de la imagen recién publicada: deploy.yml verifica su atestación
  # y no hace nada mientras no exista el environment `production` con secretos.
  deploy:
    name: Desplegar en producción
    needs: [release-please, image]
    uses: ./.github/workflows/deploy.yml
    permissions:
      contents: read
      packages: read
      attestations: read
    with:
      version: ${{ needs.release-please.outputs.tag_name }}
      image: ${{ needs.image.outputs.ref }}
    # Sin `secrets: inherit`: los secretos de despliegue son del environment
    # `production`, que deploy.yml declara en su job; nada más le llega.

  sbom-app:
    name: SBOM de la app → release
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    # Siempre, haya o no APK: el inventario de dependencias de la app de
    # cada versión queda publicado junto a la release.
    permissions:
      contents: write # subir el SBOM a la release
    env:
      TAG: ${{ needs.release-please.outputs.tag_name }}
      SYFT_VERSION: 1.54.1
      SYFT_SHA256: c069905b391cc4c20a5ba65ad5c10be2a7ba074f8ea6ad203e24d14e303dad47
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
          persist-credentials: false

      - name: Generar y adjuntar el SBOM de la app
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl -sSfL -o syft.tar.gz \
            "https://github.com/anchore/syft/releases/download/v${SYFT_VERSION}/syft_${SYFT_VERSION}_linux_amd64.tar.gz"
          echo "${SYFT_SHA256}  syft.tar.gz" | sha256sum -c -
          tar -xzf syft.tar.gz syft && rm syft.tar.gz
          ./syft scan dir:app -q \
            -o spdx-json=sbom-app.spdx.json \
            -o cyclonedx-json=sbom-app.cdx.json
          gh release upload "$TAG" sbom-app.spdx.json sbom-app.cdx.json \
            --repo "$GITHUB_REPOSITORY" --clobber

  android:
    name: APK firmado → release (si hay llave de subida)
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write # subir el APK a la release
      id-token: write
      attestations: write
    env:
      TAG: ${{ needs.release-please.outputs.tag_name }}
      VERSION: ${{ needs.release-please.outputs.version }}
      ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_B64 }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_PASSWORD }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}
    steps:
      - name: ¿Hay llave de subida configurada?
        id: key
        run: |
          if [ -n "$ANDROID_KEYSTORE_B64" ] && [ -n "$ANDROID_KEY_ALIAS" ] \
             && [ -n "$ANDROID_KEYSTORE_PASSWORD" ] && [ -n "$ANDROID_KEY_PASSWORD" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Release ${TAG} sin APK: faltan los secretos ANDROID_UPLOAD_* (CONTRIBUTING.md, Releases)."
            echo "Release ${TAG} publicada **sin APK**: faltan los secretos ANDROID_UPLOAD_*." >> "$GITHUB_STEP_SUMMARY"
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.key.outputs.present == 'true'
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
          persist-credentials: false

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        if: steps.key.outputs.present == 'true'
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        if: steps.key.outputs.present == 'true'
        with:
          channel: stable
          flutter-version: 3.44.9

      - name: Build del APK firmado
        if: steps.key.outputs.present == 'true'
        working-directory: app
        run: |
          echo "$ANDROID_KEYSTORE_B64" | base64 -d > android/app/upload.jks
          printf 'storeFile=upload.jks\nkeyAlias=%s\nstorePassword=%s\nkeyPassword=%s\n' \
            "$ANDROID_KEY_ALIAS" "$ANDROID_KEYSTORE_PASSWORD" "$ANDROID_KEY_PASSWORD" \
            > android/key.properties
          flutter pub get --enforce-lockfile
          dart run build_runner build --delete-conflicting-outputs
          flutter build apk --release --build-name="$VERSION" --build-number="$GITHUB_RUN_NUMBER"
          rm android/key.properties android/app/upload.jks
          cp build/app/outputs/flutter-apk/app-release.apk "../visitacampo-${VERSION}.apk"

      - name: Verificar firma (no debug)
        if: steps.key.outputs.present == 'true'
        run: |
          BT="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)"
          "$BT/apksigner" verify --print-certs "visitacampo-${VERSION}.apk" | tee certs.txt
          if grep -q "CN=Android Debug" certs.txt; then echo "Firmado con la clave de debug"; exit 1; fi
          sha256sum "visitacampo-${VERSION}.apk" > "visitacampo-${VERSION}.apk.sha256"

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        if: steps.key.outputs.present == 'true'
        with:
          subject-path: visitacampo-*.apk

      # SBOM atestado sobre el APK concreto: vincula criptográficamente el
      # binario publicado con el inventario de lo que contiene.
      - name: SBOM de la app para la atestación
        if: steps.key.outputs.present == 'true'
        env:
          SYFT_VERSION: 1.54.1
          SYFT_SHA256: c069905b391cc4c20a5ba65ad5c10be2a7ba074f8ea6ad203e24d14e303dad47
        run: |
          curl -sSfL -o syft.tar.gz \
            "https://github.com/anchore/syft/releases/download/v${SYFT_VERSION}/syft_${SYFT_VERSION}_linux_amd64.tar.gz"
          echo "${SYFT_SHA256}  syft.tar.gz" | sha256sum -c -
          tar -xzf syft.tar.gz syft && rm syft.tar.gz
          ./syft scan dir:app -q -o spdx-json=sbom-app.spdx.json

      - uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        if: steps.key.outputs.present == 'true'
        with:
          subject-path: visitacampo-*.apk
          sbom-path: sbom-app.spdx.json

      - name: Adjuntar APK y checksum a la release
        if: steps.key.outputs.present == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "$TAG" "visitacampo-${VERSION}.apk" "visitacampo-${VERSION}.apk.sha256" \
            --repo "$GITHUB_REPOSITORY" --clobber
