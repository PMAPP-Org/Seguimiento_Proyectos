name: Dependency Review

# Bloquea un PR que **introduce** una dependencia con vulnerabilidad conocida
# o con una licencia copyleft fuerte (OWASP A03:2025; ISO 27001 A.8.8 y
# A.5.32 derechos de propiedad intelectual). Mira solo el diff de
# dependencias del PR (pubspec.lock, requirements*.lock, actions), así que es
# complementario a osv-scanner, que escanea todo el árbol.
#
# Licencias: docs/08 §3 ya descartó reutilizar código GPL de QField para no
# arrastrar copyleft sobre VisitaCampo; esta lista lo aplica a dependencias.

on:
  pull_request:

permissions:
  contents: read

jobs:
  dependency-review:
    name: dependencias nuevas (CVE + licencias)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: moderate
          deny-licenses: >-
            GPL-2.0-only, GPL-2.0-or-later, GPL-3.0-only, GPL-3.0-or-later,
            AGPL-3.0-only, AGPL-3.0-or-later, SSPL-1.0
