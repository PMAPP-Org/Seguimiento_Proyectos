name: PR title

# El título del PR es el mensaje del commit que entra en master con "Squash
# and merge", y release-please calcula la versión y el CHANGELOG a partir de
# esos mensajes. Este check exige Conventional Commits en el título
# (`feat: …`, `fix(server): …`, `feat!: …` para breaking).
#
# Se usa `pull_request` y no `pull_request_target`: no necesita escribir en el
# PR y así no ejecuta nada con permisos elevados sobre código de un fork.

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  pull-requests: read

jobs:
  conventional-title:
    name: título en Conventional Commits
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6.1.1
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          types: |
            feat
            fix
            perf
            revert
            docs
            build
            ci
            test
            refactor
            chore
          requireScope: false
