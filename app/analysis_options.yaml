# This file configures the analyzer, which statically analyzes Dart code to
# check for errors, warnings, and lints.
#
# The issues identified by the analyzer are surfaced in the UI of Dart-enabled
# IDEs (https://dart.dev/tools#ides-and-editors). The analyzer can also be
# invoked from the command line by running `flutter analyze`.

# The following line activates a set of recommended lints for Flutter apps,
# packages, and plugins designed to encourage good coding practices.
include: package:flutter_lints/flutter.yaml

# Paso 10 (doc 08 ADR-001): reglas más estrictas que el set por defecto,
# consistentes con lo que Paso 3 (mobile.yml) ejecuta. `strict-casts` +
# `strict-inference` + `strict-raw-types` son las tres banderas del analizador
# (no del linter) que hacen que un `dynamic` implícito sea un error de
# compilación, no una advertencia — la mitad estática de RD-02/RD-03 (nunca
# acceder sin validar a datos externos: red, disco, plataforma).
analyzer:
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true

linter:
  # El resto de RD-02/RD-03 lo cierran los tipos sellados de `freezed`
  # (Paso 10 en adelante) y el parseo `Ok/Err` explícito del `SyncEngine`
  # (Paso 12) — estas reglas son la malla de seguridad estática que evita
  # que alguien la rodee sin darse cuenta.
  rules:
    avoid_dynamic_calls: true
    avoid_print: true
    avoid_slow_async_io: true
    cancel_subscriptions: true
    close_sinks: true
    unawaited_futures: true
    prefer_final_locals: true
    prefer_final_in_for_each: true
    always_declare_return_types: true
    avoid_type_to_string: true
    throw_in_finally: true
    cast_nullable_to_non_nullable: true
    no_adjacent_strings_in_list: true

# Additional information about this file can be found at
# https://dart.dev/guides/language/analysis-options
